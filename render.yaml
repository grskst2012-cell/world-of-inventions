# Render Blueprint: the Telegram bot (Python web service, webhook).
# The showcase site is published by GitHub Pages (.github/workflows/pages.yml).
services:
  - type: web
    name: world-of-inventions-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false

