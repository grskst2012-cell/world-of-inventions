# Render Blueprint: the Telegram bot (Python web service, webhook) and the
# showcase site (static). Render > New > Blueprint > pick this repository.
services:
  - type: web
    name: world-of-inventions-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false

  - type: web
    name: world-of-inventions
    runtime: static
    rootDir: site
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /exhibits/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
